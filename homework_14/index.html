<!doctype html>
<html lang="zxx">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700&display=swap" rel="stylesheet" />
		<link rel="stylesheet" href="css/reset.css" />
		<link rel="stylesheet" href="css/style.css" />
		<title>Homework 14</title>
	</head>
	<body>
		<div class="wrapper">
			<header id="top" class="header">
				<div class="header__container">
					<h1 class="header__title title title--big">Homework 14</h1>
				</div>
			</header>
			<main class="page">
				<section class="page__contact contact">
					<div class="contact__container">
						<h2 class="contact__title title">HW. Part 1</h2>
						<form class="contact__form form-contact" action="#" enctype="multipart/form-data">
							<div class="form-contact__line">
								<label class="form-contact__label" for="name">Your name </label>
								<input class="form-contact__input" required autocomplete="off" placeholder="Abc" name="form[]" id="name" />
							</div>
							<div class="form-contact__line">
								<label class="form-contact__label" for="email">Email address </label>
								<input class="form-contact__input" required autocomplete="off" placeholder="Abc@def.com" name="form[]" type="email" id="email" />
							</div>
							<div class="form-contact__line">
								<label class="form-contact__label" for="subject">Subject </label>
								<input class="form-contact__input" autocomplete="off" placeholder="This is an optional" name="form[]" id="subject" />
							</div>
							<div class="form-contact__line">
								<label class="form-contact__label" for="message">Message </label>
								<textarea class="form-contact__textarea" required autocomplete="off" placeholder="Hi! i’d like to ask about" name="form[]" id="message"></textarea>
							</div>
							<button class="form-contact__button">Submit</button>
						</form>
					</div>
				</section>
				<section class="page__options options">
					<div class="options__container">
						<h2 class="options__title title">HW. Part 2</h2>
						<form class="options__form form-options" action="#" enctype="multipart/form-data">
							<div class="form-options__row form-options__row--size">
								<h3 class="form-options__title-form">Size</h3>
								<div class="form-options__body">
									<div class="form-options__line">
										<input id="size-l" checked type="radio" name="form[size]" value="l" class="form-options__input form-options__input--visually-hidden" />
										<label for="size-l" class="form-options__label">L</label>
									</div>
									<div class="form-options__line">
										<input id="size-xl" type="radio" name="form[size]" value="xl" class="form-options__input form-options__input--visually-hidden" />
										<label for="size-xl" class="form-options__label">XL</label>
									</div>
									<div class="form-options__line">
										<input id="size-xs" type="radio" name="form[size]" value="xs" class="form-options__input form-options__input--visually-hidden" />
										<label for="size-xs" class="form-options__label">XS</label>
									</div>
								</div>
							</div>
							<div class="form-options__row form-options__row--color">
								<h3 class="form-options__title-form">Color</h3>
								<div class="form-options__body">
									<div class="form-options__line">
										<input id="color-blue" checked type="radio" name="form[color]" value="l" class="form-options__input form-options__input--visually-hidden" />
										<label for="color-blue" class="form-options__label form-options__label-blue"></label>
									</div>
									<div class="form-options__line">
										<input id="color-black" type="radio" name="form[color]" value="xl" class="form-options__input form-options__input--visually-hidden" />
										<label for="color-black" class="form-options__label form-options__label-black"></label>
									</div>
									<div class="form-options__line">
										<input id="color-brown" type="radio" name="form[color]" value="xs" class="form-options__input form-options__input--visually-hidden" />
										<label for="color-brown" class="form-options__label form-options__label-brown"></label>
									</div>
								</div>
							</div>
						</form>
					</div>
				</section>
				<section class="page__testwork testwork">
					<div class="testwork__container">
						<h2 class="testwork__title title">Test</h2>
						<form class="testwork__form form-testwork" action="#" enctype="multipart/form-data">
							<div class="form-testwork__line">
								<label for="name-test" class="form-testwork__label">Ім'я</label>
								<input id="name-test" required maxlength="5" minlength="2" autocomplete="off" name="form[]" placeholder="Введіть ім'я" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="email-test" class="form-testwork__label">Пошта</label>
								<input id="email-test" required autocomplete="off" pattern="^[\w\.\-]+@[\w\-]+\.[\w\-\.]+$" name="form[]" type="email" placeholder="Введіть пошту" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="tel" class="form-testwork__label">Телефон</label>
								<input id="tel" required autocomplete="off" name="form[]" type="tel" placeholder="Введіть номер телефону" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="password" class="form-testwork__label">Пароль</label>
								<input id="password" required autocomplete="off" name="form[]" type="password" placeholder="Введіть пароль" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="number" class="form-testwork__label">Число</label>
								<input id="number" required autocomplete="off" name="form[]" type="number" placeholder="Введіть число" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="color" class="form-testwork__label">Введіть колір</label>
								<input id="color" name="form[]" type="color" class="form-testwork__input form-testwork__input--color" />
							</div>
							<div class="form-testwork__line">
								<label for="search" class="form-testwork__label">Пошук</label>
								<input id="search" required autocomplete="off" name="form[]" type="search" placeholder="Введіть запит" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="date" class="form-testwork__label">Дата</label>
								<input id="date" required autocomplete="off" name="form[]" type="date" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="textarea" class="form-testwork__label">Введіть повідомлення</label>
								<textarea id="textarea" required autocomplete="off" name="form[]" class="form-testwork__textarea"></textarea>
							</div>
							<div class="form-testwork__line">
								<label for="file" class="form-testwork__label">Додати файл</label>
								<input id="file" required name="form[]" multiple accept=".jpg, .png" type="file" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<label for="range" class="form-testwork__label">Введіть щось</label>
								<input id="range" autocomplete="off" name="form[]" type="range" value="0" class="form-testwork__input" />
							</div>
							<div class="form-testwork__line">
								<h3 class="form-testwork__label">Випадаючий список</h3>
								<select class="form-testwork__select" name="form[select]">
									<option selected value="1">Перший</option>
									<option value="2">Другий</option>
									<option value="3">Третій</option>
								</select>
							</div>
							<div class="form-testwork__line">
								<h3 class="form-testwork__label">Множинний вибір</h3>
								<div class="form-testwork__line-checkbox">
									<input id="color-white" checked name="form[car]" type="checkbox" class="form-testwork__input-checkbox form-testwork__input-checkbox--visually-hidden" />
									<label for="color-white" class="form-testwork__label-checkbox">Білий</label>
								</div>
								<div class="form-testwork__line-checkbox">
									<input id="color-red" name="form[car]" type="checkbox" class="form-testwork__input-checkbox form-testwork__input-checkbox--visually-hidden" />
									<label for="color-red" class="form-testwork__label-checkbox">Червоний</label>
								</div>
								<div class="form-testwork__line-checkbox">
									<input id="color-green" name="form[car]" type="checkbox" class="form-testwork__input-checkbox form-testwork__input-checkbox--visually-hidden" />
									<label for="color-green" class="form-testwork__label-checkbox">Зелений</label>
								</div>
							</div>
							<div class="form-testwork__line">
								<h3 class="form-testwork__label">Одиночний вибір</h3>
								<div class="form-testwork__line-options">
									<input id="country-ukraine" value="ukraine" checked name="form[country]" type="radio" class="form-testwork__input-options form-testwork__input-options --visually-hidden" />
									<label for="country-ukraine" class="form-testwork__label-options">Ukraine</label>
								</div>
								<div class="form-testwork__line-options">
									<input id="country-poland" value="poland" name="form[country]" type="radio" class="form-testwork__input-options form-testwork__input-options --visually-hidden" />
									<label for="country-poland" class="form-testwork__label-options">Poland</label>
								</div>
								<div class="form-testwork__line-options">
									<input id="country-usa" value="usa" name="form[country]" type="radio" class="form-testwork__input-options form-testwork__input-options --visually-hidden" />
									<label for="country-usa" class="form-testwork__label-options">USA</label>
								</div>
							</div>
							<div class="form-testwork__line form-testwork__line--buttons">
								<button class="form-testwork__button" type="button">Кнопка</button>
								<button class="form-testwork__button" type="reset">Очистити</button>
								<button class="form-testwork__button">Відправити</button>
							</div>
						</form>
					</div>
				</section>
			</main>
			<footer class="footer">
				<div class="footer__container">
					<h2 class="footer__title title">Thank you for your attention!!!</h2>
					<div class="footer__text">
						<p>To return to the top, press the "Наверх" button</p>
					</div>
					<a class="footer__link" href="#top">
						<div class="footer__image">
							<img src="img/tablet.jpg" alt="Tablet in the form of a button with the inscription: Up" />
						</div>
					</a>
				</div>
			</footer>
		</div>
	</body>
</html>
